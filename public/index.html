<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#list">Skip to internships</a>
  <header><h1>Internship Board</h1></header>
  <main>
    <section aria-labelledby="filters-h">
      <h2 id="filters-h" class="sr-only">Search and filters</h2>
      <form id="filters" role="search" novalidate>
        <div class="field"><label for="q">Search</label>
          <input id="q" type="search" maxlength="100" placeholder="Title, domain or skill"></div>
        <div class="field"><label for="domain">Domain</label>
          <select id="domain"><option value="">All domains</option>
            <option>Full Stack Development</option><option>UI/UX</option>
            <option>Data Analytics</option><option>Cyber Security</option></select></div>
        <div class="field"><label for="mode">Work mode</label>
          <select id="mode"><option value="">All modes</option>
            <option>Remote</option><option>Hybrid</option><option>On-site</option></select></div>
      </form>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="error" class="panel" hidden>
      <p>Could not load internships. Check your connection and try again.</p>
      <button type="button" id="retry">Retry</button>
    </div>
    <p id="empty" class="panel" hidden>No internships match your search.</p>
    <ul id="list" class="cards" aria-label="Internships"></ul>
  </main>

  <dialog id="apply-dialog" aria-labelledby="apply-title">
    <form id="apply-form" novalidate>
      <h2 id="apply-title">Apply</h2>
      <input type="hidden" id="internshipId" name="internshipId">
      <div class="field"><label for="name">Full name <span aria-hidden="true">*</span></label>
        <input id="name" name="name" autocomplete="name" maxlength="100" required aria-describedby="name-err">
        <p class="err" id="name-err"></p></div>
      <div class="field"><label for="email">Email <span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="email-err">
        <p class="err" id="email-err"></p></div>
      <div class="field"><label for="portfolioUrl">Portfolio link (optional)</label>
        <input id="portfolioUrl" name="portfolioUrl" type="url" maxlength="300" placeholder="https://" aria-describedby="portfolioUrl-err">
        <p class="err" id="portfolioUrl-err"></p></div>
      <div class="field"><label for="message">Message (optional)</label>
        <textarea id="message" name="message" rows="4" maxlength="1000" aria-describedby="message-err"></textarea>
        <p class="err" id="message-err"></p></div>
      <p class="err" id="form-err" role="alert"></p>
      <p class="ok" id="form-ok" role="status"></p>
      <div class="actions">
        <button type="submit" id="submit">Submit application</button>
        <button type="button" id="cancel" class="secondary">Close</button>
      </div>
    </form>
  </dialog>
  <script src="main.js"></script>
</body>
</html>
